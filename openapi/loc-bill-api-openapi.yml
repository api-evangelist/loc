  parameters:
    sort:
      name: sort
      in: query
      description: Sort by update date in Congress.gov. Value can be updateDate+asc or updateDate+desc.
      required: false
      schema:
        type: string
    congress:
      name: congress
      in: path
      description: The congress number. For example, can be 117.
      required: true
      schema:
        type: integer
        format: int32
    limit:
      name: limit
      in: query
      description: The number of records returned. The maximum limit is 250.
      required: false
      schema:
        type: integer
    offset:
      name: offset
      in: query
      description: The starting record returned. 0 is the first record.
      required: false
      schema:
        type: integer
    lawType:
      name: lawType
      in: path
      description: The law type. Values are either 'pub’ or ‘priv.’
      required: true
      schema:
        type: string
    billType:
      name: billType
      in: path
      description: The type of bill. Value can be hr, s, hjres, sjres, hconres, sconres, hres, or sres.
      required: true
      schema:
        type: string
    billNumber:
      name: billNumber
      in: path
      description: The bill's assigned number. For example, the value can be 3076.
      required: true
      schema:
        type: integer
    format:
      name: format
      in: query
      description: The data format. Value can be xml or json.
      required: false
      schema:
        type: string
        default: xml
        enum:
        - xml
        - json
    lawNumber:
      name: lawNumber
      in: path
      description: The law number
      required: true
      schema:
        type: integer
    fromDateTime:
      name: fromDateTime
      in: query
      description: 'The starting timestamp to filter by update date. Use format: YYYY-MM-DDT00:00:00Z.'
      required: false
      schema:
        type: string
    toDateTime:
      name: toDateTime
      in: query
      description: 'The ending timestamp to filter by update date. Use format: YYYY-MM-DDT00:00:00Z.'
      required: false
      schema:
        type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key
