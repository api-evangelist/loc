apis:
- name: Chronicling America API
  description: >-
    The Chronicling America API provides access to the historic American newspapers collection digitized
    by the Library of Congress and its partners. Endpoints allow searching and retrieving pages, titles,
    batches, and OCR text. No authentication is required.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
